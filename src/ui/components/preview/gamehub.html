<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GameHub — full-screen composition preview (1080 scale)</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+Thai+Looped:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0"
      rel="stylesheet"
    />
    <style>
      body { margin: 0; background: #2b3036; display: flex; gap: 24px; padding: 16px; font-family: "Noto Sans Thai", sans-serif; }
      .note { color: #cdd5dd; font-size: 13px; max-width: 240px; }
      /* phone frame — mimics .hub-clean-shell (mobile column) */
      .gh-phone {
        position: relative;
        flex: 0 0 auto;
        width: 440px;
        height: calc(100vh - 32px);
        border-radius: 28px;
        overflow: hidden;
        background: linear-gradient(180deg, #eaf3ff 0%, #f3f7ee 100%);
        box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      }
      .gh-phone__scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; }
    </style>
  </head>
  <body>
    <div class="gh-phone"><div class="gh-phone__scroll" id="gh-scroll"></div></div>
    <p class="note">Step 8a — level path + header composed at Figma 1080 scale, scaled to the phone column via <code>zoom</code>. Verifies node states, connector states (solid leaves current), day header, current card, rest/check-in emoji, scroll.</p>
    <script type="module" src="./gamehub.js"></script>
  </body>
</html>
