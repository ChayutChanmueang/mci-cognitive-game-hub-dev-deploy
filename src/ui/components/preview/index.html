<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GameHub components — isolation preview</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+Thai+Looped:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0"
      rel="stylesheet"
    />
    <style>
      /* harness chrome only — NOT part of any component */
      body {
        margin: 0;
        padding: 32px;
        font-family: "Noto Sans Thai", system-ui, sans-serif;
        background: #eef1f4;
        color: #1c2226;
      }
      h1 { font-size: 18px; margin: 0 0 4px; }
      .preview-note { font-size: 13px; opacity: 0.6; margin: 0 0 24px; }
      .preview-row {
        display: flex; flex-wrap: wrap; gap: 28px;
        align-items: flex-start; margin-bottom: 28px;
      }
      .preview-item { display: flex; flex-direction: column; gap: 10px; align-items: center; }
      .preview-item figcaption { font-size: 12px; opacity: 0.65; }
      .preview-stage {
        display: flex; align-items: center; justify-content: center;
        padding: 48px; border-radius: 16px; background: #cfd6dd;
      }
      .preview-stage--dark { background: #8aa0b4; }
      .preview-empty {
        padding: 40px; border: 1px dashed #9aa6b1; border-radius: 12px;
        font-size: 14px; opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <h1>GameHub-UI components — isolation preview</h1>
    <p class="preview-note">
      Dev-only harness (not in the production build). Each Part renders its ported
      component(s) here for visual review before wiring into game-hub-screen.js.
    </p>
    <div id="preview-root"></div>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
