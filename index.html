<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#028af8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+Thai+Looped:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <title>MCI Cognitive Games</title>
    <script>
      // Register service worker immediately — do NOT wait for 'load' event.
      // The 'load' event waits for ALL subresources (fonts, large scripts, etc.)
      // and on Vercel this can be delayed enough to prevent SW registration.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(function(reg) {
            console.log('[PWA] Service Worker registered, scope:', reg.scope);
          })
          .catch(function(err) {
            console.warn('[PWA] Service Worker registration failed:', err);
          });
      }
    </script>
</head>

<body>
    <script>
      // Opt-in local error relay for debugging. Enable with:
      // window.__ENABLE_LOCAL_ERROR_LOGGER__ = true
      (function() {
        if (!window.__ENABLE_LOCAL_ERROR_LOGGER__) {
          return;
        }

        const sendLocalError = function(body) {
          fetch('http://localhost:9999', { method: 'POST', body }).catch(function(){});
        };

        window.addEventListener('error', function(e) {
          sendLocalError('ERROR: ' + e.message + '\n' + e.error?.stack);
        });
        window.addEventListener('unhandledrejection', function(e) {
          sendLocalError('UNHANDLED REJECTION: ' + e.reason?.message + '\n' + e.reason?.stack);
        });

        const origError = console.error;
        console.error = function(...args) {
          sendLocalError('CONSOLE ERROR: ' + args.map(a => a?.stack || a).join(' '));
          origError.apply(console, args);
        };
      })();
    </script>
    <div id="app">
        <div id="ui-root"></div>
        <div id="game-container"></div>
    </div>
    <script src="/js/material-bundle.js"></script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
