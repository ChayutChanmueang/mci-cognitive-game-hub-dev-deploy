<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/test-game-hub-style.css">
    <link rel="stylesheet" href="/src/util/video-player/video-player.css">
    <title>Phaser - Template</title>
</head>

<body>
    <script>
      window.addEventListener('error', function(e) {
        fetch('http://localhost:9999', { method: 'POST', body: 'ERROR: ' + e.message + '\n' + e.error?.stack }).catch(() => {});
      });
      window.addEventListener('unhandledrejection', function(e) {
        fetch('http://localhost:9999', { method: 'POST', body: 'UNHANDLED REJECTION: ' + e.reason?.message + '\n' + e.reason?.stack }).catch(() => {});
      });
      // Monkey patch console.error
      const origError = console.error;
      console.error = function(...args) {
        fetch('http://localhost:9999', { method: 'POST', body: 'CONSOLE ERROR: ' + args.map(a => a?.stack || a).join(' ') }).catch(() => {});
        origError.apply(console, args);
      };
    </script>
    <div id="app">
        <div id="ui-root"></div>
        <div id="game-container"></div>
    </div>
    <script src="/js/material-bundle.js"></script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
